<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Enviando foto…</title></head>
<body style="font-family:sans-serif;padding:24px">Enviando a foto de perfil… esta janela fecha sozinha.
<script>
(async () => {
  const img = new Image(); img.src = 'perfil-instagram.png?v=3'; await img.decode();
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1080;
  c.getContext('2d').drawImage(img, 0, 0, 1080, 1080);
  const d = c.toDataURL('image/jpeg', 0.92);
  if (window.opener) window.opener.postMessage({ bbFoto: d }, 'https://www.instagram.com');
  setTimeout(() => window.close(), 1500);
})();
</script>
</body></html>
