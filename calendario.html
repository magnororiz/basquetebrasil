<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário · Basquete Brasil</title>
<meta name="description" content="Calendário dos jogos do basquete de base publicados pelas federações estaduais, com local, posição dos times e narrador da transmissão.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0B1B3F;background:#F4F6FA}
a{color:#00752C}a:hover{color:#005A22}
.h{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filtros label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A5675}
.filtros select,.filtros input{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D3EA;border-radius:8px;background:#FFFFFF;color:#0B1B3F;min-width:160px}
.dia{margin:28px 0 10px;font-size:22px;font-weight:700;color:#002776}
.jogo{width:100%;display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;text-align:left;background:#FFFFFF;border:1px solid #E3E7EF;border-radius:12px;padding:14px 16px;margin:0 0 10px;cursor:pointer;font:inherit;color:inherit}
.jogo:hover,.jogo:focus-visible{border-color:#009C3B;box-shadow:0 2px 10px rgba(0,39,118,.08);outline:none}
.hora{font-weight:700;font-size:18px}
.cat{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;background:#EEF1F6;color:#002776;border-radius:999px;padding:3px 10px;margin-top:4px}
.times{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-weight:600;font-size:16px}
.times .x{color:#8A94AD;font-weight:500}
.placar{font-family:"Barlow Condensed",Inter,sans-serif;font-size:20px;font-weight:700;color:#002776}
.sub{font-size:13px;color:#4A5675;margin-top:4px}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px;white-space:nowrap}
.cat.cbi{background:#FFDF00;color:#002776}
.fedsel{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;margin-top:6px;padding:5px 12px 5px 18px;border-radius:10px;color:#FFFFFF;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap;cursor:pointer;text-align:left}.fedsel b{font-size:12px;font-weight:800}.fedsel small{font-size:11px;font-weight:600}.fedsel:hover{filter:brightness(1.12)}
.selo.n{background:#E7F5EC;color:#00752C}.selo.v{background:#F4F6FA;color:#8A94AD}
.escudo{width:28px;height:28px;object-fit:contain;flex:none}
.semlogo{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#EEF1F6;color:#8A94AD;font-size:9px;font-weight:700;flex:none}
.fundo{position:fixed;inset:0;background:rgba(0,26,82,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.fundo.aberto{display:flex}
.janela{background:#FFFFFF;border-radius:16px;width:100%;max-width:760px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.jtopo{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#002776;color:#FFFFFF;padding:14px 20px}
.fechar{min-width:44px;min-height:44px;border:0;border-radius:8px;background:#0F3175;color:#FFFFFF;font-size:22px;cursor:pointer}
.metades{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #E3E7EF}
.metade{padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.metade+.metade{border-left:1px solid #E3E7EF}
.metade .rot{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A5675}
.metade .nome{font-size:20px;font-weight:700}
.metade img{width:84px;height:84px;object-fit:contain}
.metade .semlogo{width:84px;height:84px;font-size:13px}
.pos{font-size:14px;color:#0B1B3F;background:#FFF8CC;border-radius:8px;padding:6px 10px}
.pos.sem{background:#F4F6FA;color:#8A94AD}
.info{padding:18px 20px;display:grid;gap:10px;font-size:15px}
.info b{color:#4A5675;font-weight:600;display:inline-block;min-width:110px}
.narr{margin:0 20px 18px;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.narr.com{background:#E7F5EC}.narr.sem{background:#F4F6FA;color:#4A5675}
.assistir{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;background:#00752C;color:#FFFFFF;font-weight:700;text-decoration:none}
.assistir:hover{background:#005A22;color:#FFFFFF}
.assistir .dica{position:absolute;bottom:calc(100% + 8px);right:0;background:#0B1B3F;color:#FFFFFF;font-size:12px;font-weight:500;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.assistir:hover .dica,.assistir:focus-visible .dica{opacity:1}
.fonte{padding:0 20px 20px;font-size:12px;color:#8A94AD;line-height:1.6}
.venc{font-weight:800;color:#00752C}.perd{color:#4A5675}
.resultado{text-align:center;padding:14px 20px;border-bottom:1px solid #E3E7EF}
.resultado .pl{font-family:"Barlow Condensed",Inter,sans-serif;font-size:36px;font-weight:800;color:#002776}
.video{margin:0 20px 18px;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#FFF8CC}
.video.tem{background:#EEF1F6}
.forn{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.forn input{flex:1 1 260px;font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D3EA;border-radius:8px}
.bt{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:0;font:inherit;font-weight:700;cursor:pointer;background:#002776;color:#FFFFFF}
.aviso{background:#FFFFFF;border:1px solid #E3E7EF;border-radius:12px;padding:24px;color:#4A5675}
@media (max-width:640px){.jogo{grid-template-columns:130px 1fr}.jogo .selo{grid-column:1/-1;justify-self:start}.metades{grid-template-columns:1fr}.metade+.metade{border-left:0;border-top:1px solid #E3E7EF}}
</style>
</head>
<body>
<div id="bb-menu"></div>

<section style="background:#00752C;color:#FFFFFF">
<div class="wrap" style="padding:40px 24px 44px">
<h1 class="h" style="margin:0;font-size:52px;line-height:1;font-weight:800">Calendário</h1>
<p style="margin:12px 0 0;font-size:17px;line-height:1.55;color:#E6ECF7;max-width:760px">Jogos do basquete de base publicados pelas federações estaduais. Clique num jogo para ver local, posição dos times e o narrador da transmissão.</p>
<p id="fontes" style="margin:10px 0 0;font-size:14px;color:#C9F2D6"></p>
</div>
</section>

<main class="wrap" style="padding:28px 24px 56px">
<div class="filtros" role="search">
<label>Jogos<select id="fPer"><option value="prox">Jogos a realizar</option><option value="real">Jogos realizados</option></select></label>
<label>Federação<select id="fUf"><option value="">Todas</option></select></label>
<label>Categoria<select id="fCat"><option value="">Todas</option></select></label>
<label>Time<select id="fClube"><option value="">Todos</option></select></label>
</div>
<div id="lista" aria-live="polite" style="margin-top:8px"><p class="aviso">Carregando o calendário…</p></div>
</main>

<div class="fundo" id="fundo" role="dialog" aria-modal="true" aria-labelledby="jTitulo">
<div class="janela" id="janela"></div>
</div>

<div id="bb-rodape"></div>
<script src="assets/bb.js?v=a005"></script>
<script>
bbMontar('Calendário');
let DADOS = null; let NARRADOR_LOGADO = false;
try { if (sessionStorage.getItem('bb_token')) bbApi({ acao: 'eu', token: sessionStorage.getItem('bb_token') }).then(r => { NARRADOR_LOGADO = !!(r && r.ok); }); } catch (e) {}
const chave = x => String(x == null ? '' : x).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const dataNum = d => { const m = String(d).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? Number(m[3] + m[2] + m[1]) : 0; };
const hojeNum = (() => { const h = new Date(); return h.getFullYear() * 10000 + (h.getMonth() + 1) * 100 + h.getDate(); })();
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
function nomeDia(d) { const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); const dt = new Date(+m[3], +m[2] - 1, +m[1]); return DIAS[dt.getDay()] + ', ' + d; }
/* CBI (nacional de clubes): UF "BR", selo e filtro próprios, nunca somado ao estadual */
const ehCBI = j => j.uf === 'BR';
const rotuloFed = (u, fed) => u === 'BR' ? 'Nacional – CBI' : (fed ? String(fed).replace(/\s*\(dados da CBB\)/i, '').trim() + ' (' + u + ')' : u);
const ordemFed = (a, b) => (b === 'BR') - (a === 'BR') || a.localeCompare(b); /* CBI primeiro, depois os estados em ordem alfabética */
function realizado(j) { return /realizado|encerrado|finalizado/i.test(j.sit) || (j.pm !== '' && j.pv !== '') || dataNum(j.data) < hojeNum; }
function logo(j, clube, grande) {
  const src = bbEscudo(j.uf, clube);
  return src ? '<img class="escudo" src="' + src + '" alt="Escudo ' + bbEsc(clube) + '">' : '<span class="semlogo" aria-label="Sem logo">[logo]</span>';
}
function fedSelo(j) {
  const f = BB_FED[j.uf]; const nome = f ? (j.uf === 'BR' ? 'CBI – Nacional' : f.sigla + ' – ' + j.uf) : j.uf;
  return '<span class="fedsel" role="link" tabindex="0" title="' + bbEsc(f ? f.nome + ' – abrir o site' : '') + '" style="background:' + bbFedFundo(j.uf) + '"' +
    (f ? ' onclick="event.stopPropagation();window.open(\'' + f.site + '\',\'_blank\',\'noopener\')"' : '') + '><b>' + bbEsc(nome) + '</b><small>' + bbEsc(bbCat(j.cat)) + '</small></span>';
}
function posicao(j, clube) { const orig = clube === j.mand ? j.mandF : (clube === j.vis ? j.visF : clube); return DADOS.posicoes[[j.uf, chave(j.cat), chave(orig || clube)].join('|')]; }

async function iniciar() {
  const r = await bbApi({ acao: 'calendario' });
  if (!r.ok) { document.getElementById('lista').innerHTML = '<p class="aviso">' + bbEsc(r.erro || 'Não foi possível carregar o calendário.') + '</p>'; return; }
  DADOS = r; DADOS.videos = r.videos || {}; bbUnificar(r.jogos);
  const fedsCal = {}; r.jogos.forEach(j => { if (!fedsCal[j.uf]) fedsCal[j.uf] = j.fed; });
  const ufsCal = Object.keys(fedsCal).sort(ordemFed);
  document.getElementById('fontes').textContent = ufsCal.length ? 'No calendário: ' + ufsCal.map(u => rotuloFed(u, fedsCal[u])).join(', ') + ' · atualizado em ' + r.gerado : '';
  if (!r.jogos.some(j => !realizado(j))) fPer.value = 'real';
  fPer.addEventListener('change', () => { opcoes('per'); desenhar(); });
  fUf.addEventListener('change', () => { opcoes('uf'); desenhar(); });
  fCat.addEventListener('change', () => { opcoes('cat'); desenhar(); });
  fClube.addEventListener('change', desenhar);
  opcoes('per'); desenhar();
}
/* filtros em cascata: Jogos › Federação › Categoria › Time */
function encher(sel, valores, rotulo, todos) {
  const atual = sel.value; sel.length = 0; sel.add(new Option(todos, ''));
  valores.forEach(v => sel.add(new Option(rotulo ? rotulo(v) : v, v)));
  sel.value = valores.indexOf(atual) >= 0 ? atual : '';
}
function opcoes(nivel) {
  const per = fPer.value; let js = DADOS.jogos.filter(j => (per === 'real') === realizado(j));
  if (nivel === 'per') { const feds = {}; js.forEach(j => feds[j.uf] = j.fed); encher(fUf, Object.keys(feds).sort(ordemFed), u => rotuloFed(u, feds[u]), 'Todas'); }
  if (fUf.value) js = js.filter(j => j.uf === fUf.value);
  if (nivel === 'per' || nivel === 'uf') encher(fCat, [...new Set(js.map(j => j.cat))].sort((a, b) => a.localeCompare(b, 'pt', { numeric: true })), null, 'Todas');
  if (fCat.value) js = js.filter(j => j.cat === fCat.value);
  encher(fClube, [...new Set(js.flatMap(j => [j.mand, j.vis]))].sort((a, b) => a.localeCompare(b, 'pt')), null, 'Todos');
}
function vencedor(j) { const a = Number(j.pm), b = Number(j.pv); if (j.pm === '' || j.pv === '' || isNaN(a) || isNaN(b)) return ''; return a > b ? 'm' : (b > a ? 'v' : 'e'); }
function desenhar() {
  const uf = fUf.value, cat = fCat.value, per = fPer.value, cl = fClube.value;
  let js = DADOS.jogos.filter(j => (!uf || j.uf === uf) && (!cat || j.cat === cat) && ((per === 'real') === realizado(j)) && (!cl || j.mand === cl || j.vis === cl));
  js.sort((a, b) => (dataNum(a.data) - dataNum(b.data)) || String(a.hora).localeCompare(b.hora));
  if (per === 'real') js.reverse();
  const el = document.getElementById('lista');
  if (!js.length) { el.innerHTML = '<p class="aviso">' + (per === 'real' ? 'Nenhum jogo realizado' : 'Nenhum jogo a realizar') + ' com esses filtros.</p>'; return; }
  let html = '', dia = '';
  js.forEach(j => {
    if (j.data !== dia) { dia = j.data; html += '<h2 class="dia h">' + bbEsc(nomeDia(dia)) + '</h2>'; }
    const n = DADOS.narradores[j.id], vd = DADOS.videos[j.id]; const w = vencedor(j); const pl = !!w;
    const cm = w === 'm' ? 'venc' : (w === 'v' ? 'perd' : ''), cv = w === 'v' ? 'venc' : (w === 'm' ? 'perd' : '');
    const selo = n ? '<span class="selo n">🎙 ' + bbEsc(n.nome) + '</span>' : (vd ? '<span class="selo n">▶ Vídeo</span>' : '<span class="selo v">' + (per === 'real' ? 'Sem vídeo' : 'Sem narrador') + '</span>');
    html += '<button class="jogo" type="button" data-id="' + bbEsc(j.id) + '">' +
      '<div><div class="hora">' + bbEsc(j.hora || '—') + '</div>' + fedSelo(j) + '</div>' +
      '<div><div class="times">' + logo(j, j.mand) + '<span class="' + cm + '">' + bbEsc(j.mand) + '</span>' + (pl ? '<span class="placar">' + bbEsc(j.pm) + '</span>' : '') +
      '<span class="x">x</span>' + (pl ? '<span class="placar">' + bbEsc(j.pv) + '</span>' : '') + '<span class="' + cv + '">' + bbEsc(j.vis) + '</span>' + logo(j, j.vis) + '</div>' +
      '<div class="sub">' + bbEsc([j.camp, j.local].filter(Boolean).join(' · ')) + '</div></div>' + selo + '</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.jogo').forEach(b => b.addEventListener('click', () => abrir(b.dataset.id)));
}
function metade(j, clube, rotulo) {
  const p = posicao(j, clube); const src = bbEscudo(j.uf, clube);
  return '<div class="metade"><span class="rot">' + rotulo + '</span>' +
    (src ? '<img src="' + src + '" alt="Escudo ' + bbEsc(clube) + '">' : '<span class="semlogo">[logo]</span>') +
    '<span class="nome">' + bbEsc(clube) + '</span>' +
    (p ? '<span class="pos">' + bbEsc(p.pos) + 'º lugar' + (p.grupo ? ' · ' + bbEsc(p.grupo) : '') + '</span>' : '<span class="pos sem">[posição não publicada pela federação]</span>') + '</div>';
}
let ultimoFoco = null;
/* Duas janelas diferentes: jogo AGENDADO (a realizar) e jogo REALIZADO */
const rot = (t, cor) => '<div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:' + (cor || '#4A5675') + '">' + t + '</div>';
function topo(j, selo) {
  return '<div class="jtopo"><div><div id="jTitulo" class="h" style="font-size:24px;font-weight:700">' + bbEsc(j.cat) + ' · ' + bbEsc(j.camp) + '</div>' +
    '<div style="font-size:13px;color:#C9D3EA">' + bbEsc([rotuloFed(j.uf, j.fed), j.fase, j.num ? 'Jogo nº ' + j.num : ''].filter(Boolean).join(' · ')) + '</div></div>' +
    '<div style="display:flex;gap:10px;align-items:center">' + selo + '<button class="fechar" type="button" aria-label="Fechar">×</button></div></div>';
}
function info(j, sit) {
  return '<div class="info"><div><b>Data</b>' + bbEsc(nomeDia(j.data)) + '</div><div><b>Horário</b>' + bbEsc(j.hora || '[não informado pela fonte]') + '</div>' +
    '<div><b>Local</b>' + bbEsc(j.local || '[não informado pela fonte]') + '</div><div><b>Situação</b>' + bbEsc(sit) + '</div></div>';
}
function rodapeFonte(j) {
  return '<div class="fonte">Fonte: ' + bbEsc(j.fed) + (j.fonte ? ' · <a href="' + bbEsc(j.fonte.split(' ')[0]) + '" target="_blank" rel="noopener">ver origem</a>' : '') +
    '<br>Última atualização na fonte: ' + bbEsc(j.atu || 'não informado pela fonte') + ' · Data da coleta: ' + bbEsc(j.coleta || '—') + '</div>';
}
function formLink(titulo, texto) {
  return '<div class="video"><div>' + rot(titulo, '#7A5C00') + '<div>' + texto + '</div></div>' +
    '<button class="bt abrirForn" type="button">Fornecer link</button>' +
    '<form class="forn" hidden><input type="url" inputmode="url" placeholder="Cole aqui o link do YouTube" required aria-label="Link do YouTube"><button class="bt" type="submit">Enviar</button>' +
    '<div class="fornMsg" style="width:100%;font-size:14px" role="status"></div></form></div>';
}
function janelaAgendado(j) {
  const n = DADOS.narradores[j.id], vd = DADOS.videos[j.id];
  const link = n && /^https:\/\//.test(n.link) ? n.link : (vd ? vd.link : '');
  return topo(j, '<span class="selo" style="background:#FFDF00;color:#002776">Agendado</span>') +
    '<div class="metades">' + metade(j, j.mand, 'Em casa (mandante)') + metade(j, j.vis, 'Visitante') + '</div>' +
    '<div class="resultado"><div class="pl" style="color:#8A94AD">0 x 0</div><div style="font-weight:600;color:#4A5675">Jogo ainda não realizado</div></div>' +
    info(j, j.sit && !/realiz/i.test(j.sit) ? j.sit : 'Agendado') +
    (n ? '<div class="narr com"><div>' + rot(n.papel || 'Narrador', '#00752C') + '<div style="font-size:18px;font-weight:700">' + bbEsc(n.nome) + '</div></div>' +
         (link ? '<a class="assistir" href="' + bbEsc(link) + '" target="_blank" rel="noopener noreferrer">▶ Assistir a transmissão<span class="dica">Abre o link do narrador</span></a>' : '') + '</div>'
       : '<div class="narr sem"><div>' + rot('Narrador ou canal') + '<div>Nenhum narrador ou canal confirmado para este jogo.</div></div>' +
         '<a class="bt" href="narrador.html?jogo=' + encodeURIComponent(j.id) + '#marcar" style="text-decoration:none;background:#00752C">Serei o narrador ou o canal que vai transmitir</a></div>') +
    rodapeFonte(j);
}
function janelaRealizado(j) {
  const n = DADOS.narradores[j.id], vd = DADOS.videos[j.id], w = vencedor(j);
  const nlink = n && /^https:\/\//.test(n.link) ? n.link : '';
  const res = w ? '<div class="resultado"><div class="pl">' + bbEsc(j.pm) + ' x ' + bbEsc(j.pv) + '</div><div style="font-weight:700;color:#00752C">' +
      bbEsc(w === 'e' ? 'Empate' : 'Vitória: ' + (w === 'm' ? j.mand : j.vis)) + '</div></div>'
    : '<div class="resultado"><div style="font-weight:600;color:#4A5675">[placar não publicado pela federação]</div></div>';
  return topo(j, '<span class="selo" style="background:#E7F5EC;color:#00752C">Realizado</span>') +
    '<div class="metades">' + metade(j, j.mand, 'Em casa (mandante)') + metade(j, j.vis, 'Visitante') + '</div>' + res +
    info(j, 'Realizado') +
    (n ? '<div class="narr com"><div>' + rot(n.papel || 'Narrador', '#00752C') + '<div style="font-size:18px;font-weight:700">' + bbEsc(n.nome) + '</div></div>' +
         (nlink ? '<a class="assistir" href="' + bbEsc(nlink) + '" target="_blank" rel="noopener noreferrer">▶ Ver a narração<span class="dica">Abre o link do narrador</span></a>' : '') + '</div>'
       : '<div class="narr sem"><div>' + rot('Narrador ou canal') + '<div>Nenhum narrador ou canal registrado neste jogo.</div></div>' +
         '<a class="bt" href="narrador.html?jogo=' + encodeURIComponent(j.id) + '#marcar" style="text-decoration:none;background:#00752C">Fui o narrador ou o canal que transmitiu</a>' + '</div>') +
    (vd ? '<div class="video tem"><div>' + rot('Vídeo do jogo', '#002776') + '<div>' + bbEsc(vd.titulo || '') + (vd.canal ? ' · ' + bbEsc(vd.canal) : '') + '</div></div>' +
          '<a class="assistir" href="' + bbEsc(vd.link) + '" target="_blank" rel="noopener noreferrer">▶ Ver o vídeo<span class="dica">Abre no YouTube</span></a></div>'
        : (nlink ? '' : formLink('Vídeo do jogo', 'Link não encontrado.'))) + rodapeFonte(j);
}
function abrir(id) {
  const j = DADOS.jogos.find(x => x.id === id); if (!j) return;
  ultimoFoco = document.activeElement;
  janela.innerHTML = realizado(j) ? janelaRealizado(j) : janelaAgendado(j);
  fundo.classList.add('aberto'); janela.querySelector('.fechar').focus();
  const bf = janela.querySelector('.abrirForn'); if (bf) bf.addEventListener('click', () => { janela.querySelector('.forn').hidden = false; bf.hidden = true; janela.querySelector('.forn input').focus(); });
  const fe = janela.querySelector('.forn'); if (fe) fe.addEventListener('submit', async e => { e.preventDefault(); const m = janela.querySelector('.fornMsg'); m.textContent = 'Conferindo o link…';
    const r = await bbApi({ acao: 'sugerirLink', id: j.id, link: fe.querySelector('input').value });
    m.textContent = r.ok ? r.msg : r.erro; m.style.color = r.ok ? '#00752C' : '#A01616';
    if (r.ok && r.aprovado) { const r2 = await bbApi({ acao: 'calendario' }); if (r2.ok) { DADOS = r2; DADOS.videos = r2.videos || {}; bbUnificar(r2.jogos); desenhar(); abrir(j.id); } } });
  janela.querySelector('.fechar').addEventListener('click', fechar);
}
function fechar() { fundo.classList.remove('aberto'); if (ultimoFoco) ultimoFoco.focus(); }
fundo.addEventListener('click', e => { if (e.target === fundo) fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && fundo.classList.contains('aberto')) fechar(); });
iniciar();
</script>
